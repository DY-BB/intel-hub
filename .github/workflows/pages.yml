name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) 静态站点无构建步骤，仅做数据完整性校验
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验 data.js 可解析且日报对象完整
        run: |
          node -e "
          const fs = require('fs');
          const vm = require('vm');
          const code = fs.readFileSync('data.js', 'utf8');
          const ctx = { window: {} };
          vm.createContext(ctx);
          vm.runInContext(code, ctx);
          const d = ctx.window.allDailyData;
          if (!Array.isArray(d) || d.length === 0) throw new Error('allDailyData 为空');
          const ids = d.flatMap(r => (r.items || []).map(i => i.item_id));
          const dup = ids.filter((v, i) => ids.indexOf(v) !== i);
          if (dup.length) throw new Error('item_id 重复: ' + [...new Set(dup)].join(', '));
          console.log('校验通过: ' + d.length + ' 个日报 / ' + ids.length + ' 条情报');
          "

      - name: 校验静态页面引用文件齐全
        run: |
          for f in index.html app.html editor.html data.js models.js; do
            [ -f "$f" ] || { echo "缺少文件: $f"; exit 1; }
          done
          echo "文件齐全"

  # 2) 部署到 Pages
  #
  # 注意（2026-11-23 变更）：仓库 Pages 已切换为「branch / legacy」发布模式，
  # 由 GitHub 直接从 main 分支根目录发布静态文件，不再走 deploy-pages Action。
  # 原因：2026-11-21 起 deploy-pages@v4 连续失败（validate 通过、deploy 步骤 500），
  # 导致线上内容一直停留在 11-20 的版本；改用 branch 模式后构建恢复正常。
  # 本 job 因此只保留 validate 依赖关系，用于确保「有问题的数据不会被发布」——
  # 如果 validate 失败，需要人工把 main 上的坏提交修掉。
  deploy-check:
    needs: validate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 确认校验通过（发布由 branch 模式自动完成）
        run: |
          echo "Pages 采用 branch 模式：main 根目录即站点根目录，push 后由 GitHub 自动构建。"
          echo "线上校验地址：https://dy-bb.github.io/intel-hub/data.js"
