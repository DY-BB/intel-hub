name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) 静态站点无构建步骤，仅做数据完整性校验
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验 data.js 可解析且日报对象完整
        run: |
          node -e "
          const fs = require('fs');
          const vm = require('vm');
          const code = fs.readFileSync('data.js', 'utf8');
          const ctx = { window: {} };
          vm.createContext(ctx);
          vm.runInContext(code, ctx);
          const d = ctx.window.allDailyData;
          if (!Array.isArray(d) || d.length === 0) throw new Error('allDailyData 为空');
          const ids = d.flatMap(r => (r.items || []).map(i => i.item_id));
          const dup = ids.filter((v, i) => ids.indexOf(v) !== i);
          if (dup.length) throw new Error('item_id 重复: ' + [...new Set(dup)].join(', '));
          console.log('校验通过: ' + d.length + ' 个日报 / ' + ids.length + ' 条情报');
          "

      - name: 校验静态页面引用文件齐全
        run: |
          for f in index.html app.html editor.html data.js models.js; do
            [ -f "$f" ] || { echo "缺少文件: $f"; exit 1; }
          done
          echo "文件齐全"

  # 2) 部署到 Pages
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
